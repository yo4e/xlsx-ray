[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlsx-ray"
version = "0.1.0"
description = "Deterministic, read-only structural diffs and risk audits for Excel workbooks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "XLSX-Ray contributors"},
]
keywords = ["xlsx", "excel", "diff", "audit", "ooxml", "github-actions", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/yo4e/xlsx-ray"
Repository = "https://github.com/yo4e/xlsx-ray"
Issues = "https://github.com/yo4e/xlsx-ray/issues"

[project.scripts]
xlsx-ray = "xlsx_ray.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["xlsx_ray"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # Ruff formatter handles layout; long XML/URL fixture literals remain readable.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
