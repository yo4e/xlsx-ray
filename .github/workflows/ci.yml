name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run static checks
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  build:
    name: Build and validate distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: python -m pip install --upgrade pip build twine && python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Verify distribution contents
        run: |
          python -m zipfile -l dist/*.whl
          python -m zipfile -l dist/*.whl | grep -F 'xlsx_ray/schemas/diff-0.2.schema.json'
          python -m zipfile -l dist/*.whl | grep -F 'xlsx_ray/schemas/audit-0.1.schema.json'
          tar -tzf dist/*.tar.gz | grep -E '/(README.md|LICENSE|action.yml|tests/support.py)$'

  action-integration:
    name: Exercise composite Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate non-sensitive demo workbooks
        run: python examples/create_demo_workbooks.py
      - name: Run the local composite Action in report-only mode
        uses: ./
        with:
          old: examples/generated/before.xlsx
          new: examples/generated/after.xlsm
          fail-on: ""
          report-directory: .xlsx-ray/action-integration
      - name: Assert report outputs
        run: |
          test -s .xlsx-ray/action-integration/xlsx-ray.md
          test -s .xlsx-ray/action-integration/xlsx-ray.json
          python -m json.tool .xlsx-ray/action-integration/xlsx-ray.json >/dev/null
          grep -F "# XLSX-Ray workbook diff" .xlsx-ray/action-integration/xlsx-ray.md
          grep -F "defined_name" .xlsx-ray/action-integration/xlsx-ray.md
          grep -F '"kind": "defined_name"' .xlsx-ray/action-integration/xlsx-ray.json
